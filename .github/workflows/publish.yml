# Builds WebDM for Windows x64 and the WebDM Integration browser extension, and uploads everything to a DRAFT GitHub
# Release when a version tag is pushed (v1.0.0, v1.0.1-beta1, ...). "Run workflow" (workflow_dispatch) builds the same
# files as workflow artifacts without creating a release.
name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      extension_ref:
        description: "webdm-extension branch or tag to build"
        required: false
        default: "master"

permissions:
  contents: write

jobs:
  app:
    name: App (Windows x64 installer + portable zip)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JBR 25 SDK
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: windows-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: windows-gradle-

      # WebDM_<version>_windows_x64.exe / .zip in build/ci-release/binaries; the bundled ffmpeg (LGPL) and yt-dlp are
      # downloaded and checked against their release checksums during the build
      - name: Build
        shell: bash
        env:
          SKIP_ANDROID_BUILD: "true"
        run: ./gradlew createReleaseFolderForCi --no-daemon

      - name: Show the output
        shell: bash
        run: ls -la build/ci-release build/ci-release/binaries

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/ci-release

  extension:
    name: Extension (Chromium zip)
    runs-on: windows-2022
    steps:
      - name: Checkout webdm-extension
        uses: actions/checkout@v4
        with:
          repository: Mashrafi-Zaman/webdm-extension
          ref: ${{ github.event.inputs.extension_ref || 'master' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./package.json').version")-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          npm run pack:chrome
          mkdir -p out
          cp dist/chrome.zip "out/WebDM_Extension_${{ steps.version.outputs.version }}_chromium.zip"
          ls -la out

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: out

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ app, extension ]
    runs-on: windows-2022
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files and checksums
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/app/binaries/WebDM_*_windows_x64.exe artifacts/app/binaries/WebDM_*_windows_x64.zip release/
          cp artifacts/extension/*.zip release/
          cd release
          sha256sum * > "SHA256SUMS.txt"
          cat SHA256SUMS.txt
          cp ../artifacts/app/release-notes.md ../release-notes.md 2>/dev/null || touch ../release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: WebDM ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
