openapi: 3.0.0
info:
  title: Download Service API
  version: 1.0.0
  description: API for managing download tasks and queues.
servers:
  - url: http://localhost:15515
    description: Default server running on port 15515

paths:
  /add:
    post:
      summary: Add one or more downloads (shows the add-download UI unless silentAdd is set)
      description: >
        Matches AddDownloadsFromIntegration in integration/server. For backward compatibility the
        server also accepts a bare JSON array of http items (treated as items with default options).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ items ]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [ type, link ]
                    properties:
                      type:
                        type: string
                        enum: [ http, hls, segments, av, page ]
                        description: >
                          Kind of download; "hls" for HLS (.m3u8) playlists; "segments" for a stream the
                          extension rebuilt from its numbered fMP4/TS segments because no manifest was found
                          (download init + segments in order into ONE file; see init/segments below); "av" for a
                          video whose picture and sound are two separate whole files (DASH-style, often fetched by
                          the player in byte ranges): both are downloaded and merged into ONE .mp4 (needs ffmpeg);
                          "page" for a video page (YouTube, Facebook, Instagram ...): only its URL; the app reads it
                          with yt-dlp, offers the qualities and downloads/merges the chosen one.
                          Clients must check GET /capabilities first and only send types listed in jobTypes
                          (apps without /capabilities don't support "segments" or "av").
                      link:
                        type: string
                        description: The link to the download source
                      headers:
                        type: object
                        nullable: true
                        additionalProperties:
                          type: string
                        description: Optional headers for the request
                      downloadPage:
                        type: string
                        nullable: true
                        description: Optional download page URL
                      suggestedName:
                        type: string
                        nullable: true
                        description: Optional suggested file name
                      init:
                        type: string
                        nullable: true
                        description: >
                          type "segments" only: URL of the init segment (fMP4 header), written before the
                          segments; null for MPEG-TS segments
                      segments:
                        type: array
                        items:
                          type: string
                        description: >
                          type "segments" only (required there): media segment URLs in playback order;
                          concatenated after init into one .mp4 (or .ts)
                      audioInit:
                        type: string
                        nullable: true
                        description: type "segments" only, optional - init segment of a separate audio track
                      audioSegments:
                        type: array
                        items:
                          type: string
                        description: >
                          type "segments" only, optional - segments of a separate audio track, in order;
                          downloaded the same way, then merged with the video into one .mp4 (ffmpeg stream copy)
                      duration:
                        type: number
                        nullable: true
                        description: types "segments" and "av", optional - total duration in seconds (shown in the dialog)
                      estimatedSize:
                        type: integer
                        format: int64
                        nullable: true
                        description: type "segments" only, optional - estimated total size in bytes
                      quality:
                        type: string
                        nullable: true
                        description: types "segments" and "av", optional - quality label shown in the dialog, e.g. "1080p"
                      video:
                        type: string
                        description: >
                          type "av" only (required there): URL of the whole video file (without byte-range
                          query parameters)
                      audio:
                        type: string
                        nullable: true
                        description: type "av" only, optional - URL of the whole audio file
                      cookies:
                        type: array
                        description: >
                          type "page" only, optional - that site's browser cookies, for videos that need a login.
                          Send them only when GET /capabilities has features["page.cookies"] = true (the user turned
                          on "Use browser cookies"); the app uses them only to read the page and never saves them.
                        items:
                          type: object
                          required: [ name, value, domain ]
                          properties:
                            name: { type: string }
                            value: { type: string }
                            domain: { type: string }
                            path: { type: string, default: "/" }
                            secure: { type: boolean, default: false }
                            httpOnly: { type: boolean, default: false }
                            expirationDate: { type: number, nullable: true, description: seconds since the epoch }
                      videoSize:
                        type: integer
                        format: int64
                        nullable: true
                        description: >
                          type "av" only, optional - full size of the video file in bytes. Send it only when the
                          server answers Range requests with 206: the app then downloads byte-range parts in
                          parallel; without it the file is downloaded in one piece
                      audioSize:
                        type: integer
                        format: int64
                        nullable: true
                        description: type "av" only, optional - full size of the audio file in bytes (same rule)
                options:
                  type: object
                  description: Optional; all fields default to false
                  properties:
                    silentAdd:
                      type: boolean
                      default: false
                      description: Add without showing the add-download dialog
                    silentStart:
                      type: boolean
                      default: false
                      description: Start the download immediately after a silent add
            examples:
              http:
                value:
                  items:
                    - type: http
                      link: https://example.com/file.zip
                      headers: { "User-Agent": "Mozilla/5.0" }
                      downloadPage: https://example.com/
                      suggestedName: null
                  options:
                    silentAdd: false
                    silentStart: false
              segments:
                summary: Stream rebuilt from segments (video + separate audio)
                value:
                  items:
                    - type: segments
                      link: https://cdn.example.com/v/abc/init-s1080p-v1.mp4
                      headers: { "Referer": "https://example.com/watch/1" }
                      downloadPage: https://example.com/watch/1
                      suggestedName: "Example video - 1080p (rebuilt).mp4"
                      init: https://cdn.example.com/v/abc/init-s1080p-v1.mp4
                      segments:
                        - https://cdn.example.com/v/abc/seg-1-s1080p-v1.m4s
                        - https://cdn.example.com/v/abc/seg-2-s1080p-v1.m4s
                      audioInit: https://cdn.example.com/v/abc/init-a1.mp4
                      audioSegments:
                        - https://cdn.example.com/v/abc/seg-1-a1.m4s
                        - https://cdn.example.com/v/abc/seg-2-a1.m4s
                  options:
                    silentAdd: false
                    silentStart: false
              av:
                summary: Separate video and audio files (DASH-style, no manifest)
                value:
                  items:
                    - type: av
                      link: https://video.example.com/v/abc-video.mp4
                      headers: { "Referer": "https://example.com/reel/1" }
                      downloadPage: https://example.com/reel/1
                      suggestedName: "Example reel.mp4"
                      video: https://video.example.com/v/abc-video.mp4
                      audio: https://video.example.com/v/abc-audio.mp4
                      videoSize: 4570000
                      audioSize: 181000
                      duration: 30.5
                      quality: "720p"
                  options:
                    silentAdd: false
                    silentStart: false
              page:
                summary: A video page read with yt-dlp
                value:
                  items:
                    - type: page
                      link: https://www.youtube.com/watch?v=jNQXAC9IVRw
                      downloadPage: https://www.youtube.com/watch?v=jNQXAC9IVRw
                  options:
                    silentAdd: false
                    silentStart: false
      responses:
        "200":
          description: Successfully added the download
          content:
            plain/text:
              schema:
                type: string
                description: OK on success

  /capabilities:
    get:
      summary: What this app can download
      description: >
        Lets clients (the browser extension) avoid sending jobs the app doesn't understand. Also available
        over native messaging as the "capabilities" action (there "ffmpeg" is not reported). Older apps
        answer 404.
      responses:
        "200":
          description: Capabilities of this app
          content:
            application/json:
              schema:
                type: object
                required: [ app, version, jobTypes, features ]
                properties:
                  app:
                    type: string
                    example: Web Download Manager
                  version:
                    type: string
                  jobTypes:
                    type: array
                    items:
                      type: string
                    description: /add item types accepted
                    example: [ http, hls, segments, av, page ]
                  features:
                    type: object
                    additionalProperties:
                      type: boolean
                    description: >
                      hls.masterPlaylists, hls.aes128, hls.fmp4, hls.byteRange, hls.discontinuity, hls.live,
                      ffmpeg (installed right now; needed for separate audio tracks, SAMPLE-AES and .ts -> .mp4),
                      ytdlp (video pages can be read; jobTypes then contains "page") and page.cookies (the user
                      allows sending a site's cookies with "page" jobs)

  /queues:
    get:
      summary: Get list of download queues
      responses:
        "200":
          description: List of download queues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: The unique ID of the queue
                    name:
                      type: string
                      description: The name of the queue
  /start-headless-download:
    post:
      summary: Add a new download task
      requestBody:
        description: Data for adding a download task
        content:
          application/json:
            schema:
              type: object
              properties:
                downloadSource:
                  type: object
                  properties:
                    link:
                      type: string
                      description: The link to the download source
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                      description: Optional headers for the request
                    downloadPage:
                      type: string
                      description: Optional download page URL
                folder:
                  type: string
                  description: Optional folder to save the download (Unix style path)
                name:
                  type: string
                  description: Optional name for the download task
                queueId:
                  type: integer
                  description: Optional queue ID to associate the task with
      responses:
        "200":
          description: Successfully added the download task
          content:
            plain/text:
              schema:
                type: string
                description: OK on success
