openapi: 3.0.0
info:
  title: Download Service API
  version: 1.0.0
  description: API for managing download tasks and queues.
servers:
  - url: http://localhost:15515
    description: Default server running on port 15515

paths:
  /add:
    post:
      summary: Add one or more downloads (shows the add-download UI unless silentAdd is set)
      description: >
        Matches AddDownloadsFromIntegration in integration/server. For backward compatibility the
        server also accepts a bare JSON array of http items (treated as items with default options).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ items ]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [ type, link ]
                    properties:
                      type:
                        type: string
                        enum: [ http, hls ]
                        description: Kind of download; "hls" for HLS (.m3u8) playlists
                      link:
                        type: string
                        description: The link to the download source
                      headers:
                        type: object
                        nullable: true
                        additionalProperties:
                          type: string
                        description: Optional headers for the request
                      downloadPage:
                        type: string
                        nullable: true
                        description: Optional download page URL
                      suggestedName:
                        type: string
                        nullable: true
                        description: Optional suggested file name
                options:
                  type: object
                  description: Optional; all fields default to false
                  properties:
                    silentAdd:
                      type: boolean
                      default: false
                      description: Add without showing the add-download dialog
                    silentStart:
                      type: boolean
                      default: false
                      description: Start the download immediately after a silent add
            example:
              items:
                - type: http
                  link: https://example.com/file.zip
                  headers: { "User-Agent": "Mozilla/5.0" }
                  downloadPage: https://example.com/
                  suggestedName: null
              options:
                silentAdd: false
                silentStart: false
      responses:
        "200":
          description: Successfully added the download
          content:
            plain/text:
              schema:
                type: string
                description: OK on success

  /queues:
    get:
      summary: Get list of download queues
      responses:
        "200":
          description: List of download queues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: The unique ID of the queue
                    name:
                      type: string
                      description: The name of the queue
  /start-headless-download:
    post:
      summary: Add a new download task
      requestBody:
        description: Data for adding a download task
        content:
          application/json:
            schema:
              type: object
              properties:
                downloadSource:
                  type: object
                  properties:
                    link:
                      type: string
                      description: The link to the download source
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                      description: Optional headers for the request
                    downloadPage:
                      type: string
                      description: Optional download page URL
                folder:
                  type: string
                  description: Optional folder to save the download (Unix style path)
                name:
                  type: string
                  description: Optional name for the download task
                queueId:
                  type: integer
                  description: Optional queue ID to associate the task with
      responses:
        "200":
          description: Successfully added the download task
          content:
            plain/text:
              schema:
                type: string
                description: OK on success
